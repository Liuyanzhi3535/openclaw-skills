name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'sidecar/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest --cov=sidecar --cov=skills --cov-report=term-missing
