nodeOptions:
  maxOldSpaceSize: 2560

resources:
  limits:
    cpu: 2
    memory: 3Gi
  requests:
    cpu: 200m
    memory: 512Mi

initContainers:
  - name: install-skill-manifests
    image: ghcr.io/liuyanzhi3535/openclaw-skills:latest
    imagePullPolicy: Always
    command:
      - sh
      - -c
      - |
        for skill in /app/skills/*/; do
          name=$(basename "$skill")
          if [ -f "$skill/SKILL.md" ]; then
            mkdir -p /workspace/skills/$name
            cp "$skill/SKILL.md" "/workspace/skills/$name/SKILL.md"
            echo "Installed SKILL.md for $name"
          fi
        done
    volumeMounts:
      - name: data
        mountPath: /workspace
        subPath: workspace

extraContainers:
  - name: skill-executor
    image: ghcr.io/liuyanzhi3535/openclaw-skills:latest
    imagePullPolicy: Always
    volumeMounts:
      - name: data
        mountPath: /credentials
        subPath: credentials
